{% extends "base.html" %}
{% block title %}Predict | Student Performance AI{% endblock %}

{% block content %}
<div class="card">
  <h1>Predict Student Performance</h1>
  <p class="subtitle">Enter student details to get an instant AI prediction and early-warning status.</p>

  <form action="{{ url_for('predict') }}" method="POST" class="predict-form" id="predict-form">
    <label for="name">Student Name</label>
    <input type="text" id="name" name="name" placeholder="e.g. Tauhid Sheikh" required />

    <label for="attendance">Attendance (%)</label>
    <input type="number" id="attendance" name="attendance" min="0" max="100" step="0.1" required />

    <label for="previous_grade">Previous Grade / Score (%)</label>
    <input type="number" id="previous_grade" name="previous_grade" min="0" max="100" step="0.1" required />

    <label for="study_hours">Weekly Study Hours</label>
    <input type="number" id="study_hours" name="study_hours" min="0" max="60" step="0.5" required />

    <label for="assignments_completed">Assignments Completed (%)</label>
    <input type="number" id="assignments_completed" name="assignments_completed" min="0" max="100" step="0.1" required />

    <button type="submit">Predict Performance</button>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  const form = document.getElementById("predict-form");
  form.addEventListener("submit", () => {
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.classList.add("is-loading");
    btn.textContent = "Analyzing";
  });
</script>
{% endblock %}
